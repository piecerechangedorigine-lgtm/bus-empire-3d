<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#1737a8"><title>Bus Empire 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#76c9ff;font-family:system-ui,Arial,sans-serif;color:white;touch-action:pan-x pan-y}#world{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;justify-content:space-between}.top,.stats,.bottom,.routebar{display:flex;gap:8px;align-items:center}.top{justify-content:space-between}.pill,.stat,.panel{background:#222d82e8;border:2px solid #ffffffb5;border-radius:16px;box-shadow:0 4px 0 #17246c;padding:9px 12px;font-weight:900;text-shadow:0 1px 2px #15246c}.brand{text-align:center;font-weight:1000;font-size:24px;letter-spacing:1px;text-shadow:0 3px #23318c}.brand small{display:block;font-size:9px;letter-spacing:3px}.stats{margin-top:10px}.stat{flex:1;text-align:center;font-size:10px;padding:8px 4px}.stat b{display:block;font-size:14px;margin-top:3px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px}.routebar{grid-column:1/-1;justify-content:space-between}.routeinfo{font-size:12px;font-weight:900}.routeinfo small{font-weight:600;font-size:10px}.action,button{pointer-events:auto;border:2px solid white;border-radius:15px;background:linear-gradient(#ffe45b,#ff8c00);color:white;font-weight:1000;text-shadow:0 2px #8a4400;padding:12px 8px;box-shadow:0 4px 0 #9b4a09;font-size:12px}.green{background:linear-gradient(#b2ff5b,#32c91a);box-shadow:0 4px #238313}.blue{background:linear-gradient(#6ac9ff,#1c54df);box-shadow:0 4px #19338b}.tip{text-align:center;font-size:11px;font-weight:800;text-shadow:0 2px 3px #123;position:absolute;top:46%;left:12%;right:12%;pointer-events:none}.modal{display:none;pointer-events:auto;position:absolute;top:25%;left:5%;right:5%;max-height:52%;overflow:auto;background:#252d8cf5;border:3px solid white;border-radius:20px;padding:14px;box-shadow:0 5px #171e66}.modal.open{display:block}.modal h2{margin:0 0 10px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:7px 0;border-radius:12px;background:#ffffff20;font-size:12px}.item button{padding:8px}.close{float:right;background:#ff477a;padding:5px 12px}.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#252d8cf5;border:2px solid white;border-radius:14px;padding:12px;opacity:0;transition:.2s;pointer-events:none;font-weight:900}.toast.show{opacity:1}@media(min-width:700px){.ui{max-width:500px;left:50%;transform:translateX(-50%);width:100%}.modal{left:calc(50% - 220px);right:auto;width:440px}}
</style></head><body><canvas id="world"></canvas><div class="ui"><div><div class="top"><div class="pill">🪙 <span id="money">350</span></div><div class="pill">BUS EMPIRE</div><button id="camera">🎥 CAMÉRA</button></div><div class="brand">BUS EMPIRE 3D<small>BUILD • DRIVE • GROW</small></div><div class="stats"><div class="stat">🚌 FLOTTE<b id="fleet">1 bus</b></div><div class="stat">👥 PASSAGERS<b id="passengers">0</b></div><div class="stat">🏙️ VILLE<b id="level">Niv. 1</b></div></div></div><div class="tip" id="tip">Lance ta première ligne et développe ton empire !</div><div class="bottom"><div class="routebar panel"><div class="routeinfo">🛣️ <b id="routeName">Centre-ville</b><br><small id="routeState">Prêt à démarrer</small></div><button id="run" class="green">▶ DÉMARRER</button></div><button id="buy" class="action">🚌 ACHETER UN BUS<br><small>250 🪙</small></button><button id="hire" class="action blue">👨‍✈️ EMBAUCHER<br><small>100 🪙</small></button><button id="routes">🗺️ MES LIGNES</button><button id="city">🏙️ MA VILLE</button></div></div><div class="modal" id="modal"><button class="close" id="close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div><div class="toast" id="toast"></div><script type="module" src="/src/main.js"></script></body></html>
