<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d1b2a"><title>Bus Empire 3D — Transit Tycoon</title>
<style>
:root{--navy:#0d1b2a;--panel:#14283a;--panel2:#1b3548;--cream:#f7f3e8;--muted:#a8bfca;--mint:#9df0c2;--orange:#ffb45e;--line:#ffffff20}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed6b0;font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:var(--cream);touch-action:manipulation}button{font:inherit;cursor:pointer}#world{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;justify-content:space-between;gap:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:7px}.brand{font-size:12px;letter-spacing:2px;font-weight:1000}.brand span{display:block;font-size:8px;color:var(--muted);letter-spacing:1.4px;margin-top:3px}.topright{display:flex;align-items:center;gap:6px}.wallet{background:var(--navy);border:1px solid var(--line);border-radius:13px;padding:9px 11px;font-size:11px;font-weight:850;box-shadow:0 6px 18px #10233425;white-space:nowrap}.wallet strong{color:var(--mint);margin-left:4px;font-size:14px}.iconbtn{pointer-events:auto;border:1px solid var(--line);background:#102234ed;color:var(--cream);border-radius:11px;padding:9px 10px;min-height:36px;font-size:10px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.stat{background:#122333ed;border:1px solid var(--line);border-radius:12px;padding:8px 9px;box-shadow:0 5px 14px #1023341f}.stat span{display:block;font-size:8px;color:var(--muted);font-weight:850;letter-spacing:.7px;text-transform:uppercase}.stat b{display:block;font-size:15px;margin-top:4px;color:#fff9ed}.stat:nth-child(2) b{color:var(--mint)}.stat:nth-child(3) b{color:var(--orange)}.progress{height:4px;background:#ffffff21;border-radius:10px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--mint);transition:width .25s}.bottom{pointer-events:auto;background:var(--navy);border:1px solid #ffffff25;border-radius:20px;padding:11px;box-shadow:0 12px 35px #10233455}.routebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1px 1px 10px;margin-bottom:9px;border-bottom:1px solid var(--line)}.routeinfo{font-size:12px;font-weight:900}.routeinfo small{display:block;color:var(--muted);font-size:9px;font-weight:650;margin-top:4px}.routeicon{width:34px;height:34px;border-radius:10px;background:#9df0c21b;display:grid;place-items:center;font-size:18px;flex-shrink:0}.routeleft{display:flex;align-items:center;gap:8px;min-width:0}.routeinfo b{color:var(--cream)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button.action{pointer-events:auto;border:1px solid var(--line);border-radius:11px;background:#1b3548;color:var(--cream);font-weight:850;padding:10px 5px;font-size:9px;min-height:43px;box-shadow:0 3px 0 #07131d;letter-spacing:.1px}button:active{transform:translateY(2px);filter:brightness(.94)}.primary{background:var(--mint)!important;color:#102a29!important;border-color:#caffdd!important;box-shadow:0 3px 0 #479d78!important}.orange{background:var(--orange)!important;color:#352415!important;border-color:#ffdbac!important;box-shadow:0 3px 0 #ad6d35!important}.tip{position:absolute;top:44%;left:14%;right:14%;text-align:center;color:#153b34;font-weight:900;font-size:11px;text-shadow:0 1px 2px #ffffff9c;pointer-events:none;background:#ffffff42;border-radius:12px;padding:7px}.modal{display:none;pointer-events:auto;position:absolute;top:14%;left:4%;right:4%;max-height:72%;overflow:auto;background:var(--navy);border:1px solid #ffffff35;border-radius:20px;padding:16px;box-shadow:0 20px 60px #07131e99}.modal.open{display:block}.modal h2{font-size:17px;margin:0 0 5px}.modal .sub{font-size:10px;color:var(--muted);margin:0 0 13px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:7px 0;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff14;font-size:10px}.item b{font-size:12px;display:block;margin-bottom:3px}.item small{color:var(--muted);line-height:1.4}.item button{padding:8px;min-height:33px;font-size:9px;white-space:nowrap}.close{float:right;background:#344655;color:white;border:0;border-radius:9px;padding:4px 11px;min-height:28px}.wide{width:100%;margin-top:8px}.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--navy);border:1px solid #ffffff35;border-radius:12px;padding:12px 15px;opacity:0;transition:opacity .18s;pointer-events:none;font-weight:900;font-size:11px;white-space:nowrap;box-shadow:0 8px 30px #07131e65;z-index:5}.toast.show{opacity:1}.modalshade{display:none;position:absolute;inset:0;background:#06101b70;pointer-events:auto}.modalshade.open{display:block}@media(min-width:700px){.ui{max-width:500px;left:50%;transform:translateX(-50%);width:100%}.modal{left:calc(50% - 225px);right:auto;width:450px}.modalshade{left:0;right:0}}
</style></head><body><canvas id="world" aria-label="Vue 3D de la ville et des autobus"></canvas>
<div class="ui"><div><div class="top"><div class="brand">BUS EMPIRE<span>TRANSIT TYCOON · 3D</span></div><div class="topright"><div class="wallet">◈ <strong id="money">350</strong></div><button id="camera" class="iconbtn" aria-label="Changer de caméra">◉ VUE</button><button id="menu" class="iconbtn" aria-label="Ouvrir le menu">☰</button></div></div><div class="stats"><div class="stat"><span>Flotte</span><b id="fleet">1 bus</b><div class="progress"><i id="fleetProgress"></i></div></div><div class="stat"><span>Voyageurs</span><b id="passengers">0</b><div class="progress"><i id="passengerProgress"></i></div></div><div class="stat"><span>Ville</span><b id="level">Niv. 1</b><div class="progress"><i id="cityProgress"></i></div></div></div></div>
<div class="tip" id="tip">🚌 Lance ta première ligne pour gagner des pièces.</div>
<div class="bottom"><div class="routebar"><div class="routeleft"><div class="routeicon">↗</div><div class="routeinfo"><b id="routeName">Centre-ville</b><small id="routeState">Prêt à démarrer · revenus à chaque trajet</small></div></div><button id="run" class="action primary">DÉMARRER →</button></div><div class="actions"><button id="buy" class="action orange">🚌 BUS<br><small>ACHETER</small></button><button id="hire" class="action">👨‍✈️ CHAUFFEUR<br><small>RECRUTER</small></button><button id="routes" class="action">🗺️ LIGNES<br><small>GÉRER</small></button><button id="fleetBtn" class="action">🚍 FLOTTE<br><small>GARAGE</small></button><button id="city" class="action">🏙️ VILLE<br><small>AMÉLIORER</small></button><button id="achievements" class="action">🏆 SUCCÈS<br><small>OBJECTIFS</small></button></div></div></div>
<div class="modalshade" id="shade"></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="close">FERMER ✕</button><h2 id="modalTitle">Menu</h2><p class="sub" id="modalSub">Gérez votre compagnie de transport.</p><div id="modalBody"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script type="module" src="/src/main.js"></script></body></html>
