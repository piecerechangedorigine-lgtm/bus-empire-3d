<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101d2b"><title>Bus Empire 3D</title>
<style>
:root{--ink:#122333;--navy:#101d2b;--panel:#172a3a;--cream:#f5f0e4;--muted:#a9bdc8;--mint:#9df0c2;--orange:#ffb45e;--line:#ffffff20}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed6b0;font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:var(--cream);touch-action:manipulation}#world{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 13px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:11px;letter-spacing:2.5px;font-weight:950;color:var(--cream)}.brand span{display:block;font-size:8px;color:var(--muted);letter-spacing:1.5px;margin-top:3px}.wallet{background:var(--navy);border:1px solid #ffffff24;border-radius:13px;padding:10px 12px;font-size:12px;font-weight:850;box-shadow:0 6px 18px #10233425}.wallet strong{color:var(--mint);margin-left:4px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{background:#122333ed;border:1px solid #ffffff1c;border-radius:12px;padding:9px 10px;box-shadow:0 5px 14px #1023341f}.stat span{display:block;font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.9px;text-transform:uppercase}.stat b{display:block;font-size:16px;margin-top:4px;color:#fff9ed}.stat:nth-child(2) b{color:var(--mint)}.bottom{pointer-events:auto;background:var(--navy);border:1px solid #ffffff20;border-radius:22px;padding:12px;box-shadow:0 12px 35px #1023344d}.routebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 1px 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}.routeinfo{font-size:13px;font-weight:850}.routeinfo small{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:4px}.routeicon{width:36px;height:36px;border-radius:11px;background:#9df0c21b;display:grid;place-items:center;font-size:19px;flex-shrink:0}.routeleft{display:flex;align-items:center;gap:9px;min-width:0}.routeinfo b{color:var(--cream)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{pointer-events:auto;border:1px solid #ffffff1c;border-radius:12px;background:#213749;color:var(--cream);font-weight:800;padding:12px 9px;font-size:11px;min-height:45px;box-shadow:0 3px 0 #091722;letter-spacing:.15px}button:active{transform:translateY(2px);box-shadow:0 1px 0 #091722}.primary{background:var(--mint);color:#102a29;border-color:#caffdd;box-shadow:0 3px 0 #479d78}.primary:active{box-shadow:0 1px 0 #479d78}.orange{background:var(--orange);color:#352415;border-color:#ffdbac;box-shadow:0 3px 0 #ad6d35}.minor{background:#1a2d3c}.camera{padding:8px 10px;min-height:0;font-size:9px;border-radius:9px;background:#142738}.tip{position:absolute;top:47%;left:12%;right:12%;text-align:center;color:#153b34;font-weight:800;font-size:11px;text-shadow:0 1px 2px #ffffff7a;pointer-events:none}.modal{display:none;pointer-events:auto;position:absolute;top:22%;left:5%;right:5%;max-height:58%;overflow:auto;background:var(--navy);border:1px solid #ffffff2b;border-radius:20px;padding:17px;box-shadow:0 20px 60px #07131e80}.modal.open{display:block}.modal h2{font-size:17px;margin:0 0 13px}.item{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px;margin:8px 0;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff14;font-size:11px}.item b{font-size:12px}.item button{padding:8px;min-height:34px;font-size:10px}.close{float:right;background:#344655;padding:3px 10px;min-height:29px}.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--navy);border:1px solid #ffffff35;border-radius:12px;padding:12px 16px;opacity:0;transition:.2s;pointer-events:none;font-weight:850;font-size:12px;white-space:nowrap;box-shadow:0 8px 30px #07131e65}.toast.show{opacity:1}@media(min-width:700px){.ui{max-width:500px;left:50%;transform:translateX(-50%);width:100%}.modal{left:calc(50% - 220px);right:auto;width:440px}}
</style></head><body><canvas id="world"></canvas><div class="ui"><div><div class="top"><div class="brand">BUS EMPIRE<span>TRANSPORT • STRATEGY</span></div><div class="wallet">◈ <strong id="money">350</strong></div><button id="camera" class="camera">TOP VIEW LOCKED</button></div><div class="stats"><div class="stat"><span>Flotte</span><b id="fleet">1 bus</b></div><div class="stat"><span>Voyageurs</span><b id="passengers">0</b></div><div class="stat"><span>Ville</span><b id="level">Niv. 1</b></div></div></div><div class="tip" id="tip">Lance ta première ligne et développe ton réseau.</div><div class="bottom"><div class="routebar"><div class="routeleft"><div class="routeicon">↗</div><div class="routeinfo"><b id="routeName">Centre-ville</b><small id="routeState">Prêt à démarrer</small></div></div><button id="run" class="primary">LANCER LA LIGNE&nbsp; →</button></div><div class="actions"><button id="buy" class="orange">＋ ACHETER UN BUS<br><small>250 ◈</small></button><button id="hire" class="minor">＋ RECRUTER UN CHAUFFEUR<br><small>100 ◈</small></button><button id="routes" class="minor">☷ &nbsp; GÉRER LES LIGNES</button><button id="city" class="minor">⌂ &nbsp; DÉVELOPPER LA VILLE</button></div></div></div><div class="modal" id="modal"><button class="close" id="close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div><div class="toast" id="toast"></div><script type="module" src="/src/main.js"></script></body></html>
