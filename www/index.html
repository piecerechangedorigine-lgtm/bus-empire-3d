<!doctype html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a2b"><title>Traffic Command</title>
<style>
:root{color-scheme:dark;--bg:#101a2b;--panel:#19283d;--line:#31445d;--mint:#77f0bd;--gold:#ffc568;--text:#f6f7fb;--muted:#a7b7ca}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);touch-action:manipulation}button{font:inherit;cursor:pointer}#world{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;justify-content:space-between;gap:8px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:16px;font-weight:1000;letter-spacing:.3px}.brand small{display:block;font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1.4px}.pill{background:#142339ed;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:12px;font-weight:850}.pill b{color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#142339e8;border:1px solid var(--line);border-radius:13px;padding:8px 10px}.stat small{display:block;color:var(--muted);font-size:9px}.stat strong{display:block;font-size:14px;margin-top:3px}.progress{height:4px;border-radius:9px;background:#ffffff1a;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:var(--mint);width:0}.bottom{pointer-events:auto;background:#101b2ded;border:1px solid var(--line);border-radius:20px;padding:13px;box-shadow:0 12px 35px #0005}.mission{font-weight:950;font-size:14px}.desc{color:var(--muted);font-size:11px;line-height:1.45;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}button{border:1px solid var(--line);background:#21344c;color:var(--text);border-radius:12px;padding:10px 8px;font-size:11px;font-weight:850;min-height:42px}button.primary{background:var(--mint);color:#102438;border-color:#b5ffe0}button.gold{background:var(--gold);color:#342411;border-color:#ffe0a6}button:disabled{opacity:.45}.hint{position:absolute;left:12%;right:12%;top:44%;text-align:center;color:#163044;background:#effff0d9;border-radius:13px;padding:9px;font-size:12px;font-weight:900;box-shadow:0 4px 18px #0002}.modalshade{display:none;position:absolute;inset:0;background:#050b15a8;pointer-events:auto}.modalshade.open{display:block}.modal{display:none;pointer-events:auto;position:absolute;top:13%;left:4%;right:4%;max-height:74%;overflow:auto;background:#142238;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 20px 60px #0009}.modal.open{display:block}.modal h2{margin:0 0 6px;font-size:18px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.levelrow{display:flex;align-items:center;gap:10px;padding:10px;margin-top:8px;background:#ffffff08;border:1px solid var(--line);border-radius:12px}.levelrow span{flex:1;font-size:12px}.levelrow small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.close{float:right}.toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);background:#102137;border:1px solid #50647e;border-radius:14px;padding:12px 16px;font-weight:900;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}@media(min-width:700px){.ui{max-width:520px;left:50%;transform:translateX(-50%);width:100%}.modal{left:calc(50% - 230px);right:auto;width:460px}}
</style></head><body><canvas id="world" aria-label="ساحة ألغاز ثلاثية الأبعاد"></canvas>
<div class="ui"><div><div class="top"><div class="brand">TRAFFIC COMMAND<small>لعبة ألغاز المرور · حرّك المركبات وافتح الطريق</small></div><div class="pill">🪙 <b id="coins">120</b></div></div><div class="stats"><div class="stat"><small>المرحلة</small><strong id="level">1 / 30</strong><div class="progress"><i id="levelbar"></i></div></div><div class="stat"><small>النجوم</small><strong id="stars">0 ★</strong></div><div class="stat"><small>الحركات</small><strong id="moves">0</strong></div></div></div>
<div class="hint" id="hint">اسحب المركبة الحمراء نحو المخرج الأخضر.</div>
<div class="bottom"><div class="row"><div><div class="mission" id="mission">فكّ الاختناق</div><div class="desc" id="description">حرّك المركبات لفتح الطريق إلى المخرج.</div></div><button id="pause">Ⅱ</button></div><div class="actions"><button id="undo">↶ تراجع</button><button id="restart">↻ إعادة</button><button id="next" class="primary" disabled>التالي ←</button></div></div></div>
<div class="modalshade" id="shade"></div><div class="modal" id="modal" role="dialog" aria-modal="true"><button class="close" id="close">إغلاق ✕</button><h2 id="modalTitle">القائمة</h2><div class="muted" id="modalText"></div><div id="modalBody"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script></body></html>
