name: Traffic Command Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'rebuild/continuous-puzzle-campaign']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate all campaign levels
        run: npm run test:campaign
      - name: Build web game
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets into Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Traffic-Command-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
